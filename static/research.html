<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paperloom · Research</title><link rel="stylesheet" href="/research.css"><link rel="stylesheet" href="/knowledge.css"><link rel="stylesheet" href="/inbox.css"><link rel="stylesheet" href="/reader.css"><link rel="stylesheet" href="/discovery.css"><link rel="stylesheet" href="/katex.min.css"><link rel="stylesheet" href="/pdf-viewer.css"><link rel="stylesheet" href="/workspace.css"><link rel="stylesheet" href="/paper-walkthrough.css"><script defer src="/reader-vendor.js"></script><script defer src="/math.js"></script><script defer src="/research.js"></script><script defer src="/inbox.js"></script><script defer src="/reader.js"></script><script defer src="/bilingual.js"></script><script defer src="/model-graph.js"></script><script defer src="/paper-walkthrough.js"></script><script defer src="/discovery.js"></script><script defer src="/workflow.js"></script><script defer src="/knowledge.js"></script><link rel="stylesheet" href="/workspace-links.css"><script src="/workspace-links.js" defer></script></head><body>
<aside class="library"><div class="brand"><span class="logo">p</span><span>paperloom<small>RESEARCH WORKSPACE</small></span><button id="theme" title="테마: 시스템 / 밝게 / 어둡게" aria-label="테마 변경"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z"/></svg></button></div><button id="add" class="primary add"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 5v14M5 12h14"/></svg><span>논문 추가</span></button><label class="search"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="search" placeholder="라이브러리 검색" aria-label="라이브러리 검색"><kbd>⌘K</kbd></label><nav class="workspace-nav" aria-label="연구 작업"><span class="sidebar-section-label">라이브러리</span><button id="home" class="home-button" title="X·arXiv 링크를 넣고 논문으로 정리"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 4h16l2 10v6H2v-6L4 4Z"/><path d="M2 14h6l2 3h4l2-3h6"/></svg><span>받은 링크</span></button><button id="catalog" class="home-button" title="저장한 논문을 분류·검색하고 읽기"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 4h4v16H4zM10 4h4v16h-4zM16 5l4-1 3 15-4 1z"/></svg><span>내 논문</span></button><button id="discover" class="home-button" title="선행연구와 후속 인용을 그래프로 탐색"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="5" cy="6" r="3"/><circle cx="19" cy="6" r="3"/><circle cx="12" cy="19" r="3"/><path d="M8 6h8M6.5 8.6l4 7.8m7-7.8-4 7.8"/></svg><span>관련 논문</span></button><button id="notebooks" class="home-button" title="여러 논문의 공통 개념과 메모 정리"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="5" y="3" width="15" height="18" rx="2"/><path d="M9 3v18M3 7h4M3 12h4M3 17h4M12 8h5m-5 4h5"/></svg><span>개념 노트</span></button></nav><div class="list-heading"><span id="list-label">최근 작업</span><button id="all-papers">전체 보기</button></div><div id="paper-list" class="paper-list"></div><footer><button id="connections" title="계정 연결·분석 지침·앱 설정"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m9 3-.6 2.3-2 .9-2.1-.7-2 3.5 1.6 1.6v2.3L2.3 15l2 3.5 2.2-.7 2 .9L9 21h4l.6-2.3 2-.9 2.1.7 2-3.5-1.6-1.6v-2.3L19.7 9l-2-3.5-2.2.7-2-.9L13 3Z"/><circle cx="11" cy="12" r="3"/></svg><span>설정</span></button><small id="sync-label">Notion MCP 메타데이터</small></footer></aside>
<main><nav id="paper-tabs" aria-label="열린 논문"></nav><header class="topbar"><div><span class="breadcrumb">Workspace</span><span>/</span><b id="crumb">Research</b></div><div><button id="export" title="Markdown 저장">내보내기 ↓</button><button id="toggle-side" title="대화창 표시 / 숨김">대화 ◫</button></div></header><div id="paper-header"></div><nav id="tabs"><button data-tab="brief" class="selected">브리프</button><button data-tab="html">HTML 원문</button><button data-tab="pdf">PDF</button><button data-tab="annotations">하이라이트</button><button data-tab="discovery">연결 논문</button><button data-tab="graph">원문 인용</button><button data-tab="concepts">공통 개념</button><button data-tab="labs">저자·연구실</button><button data-tab="code">코드 분석</button><button data-tab="walkthrough">연산 해설</button></nav><div id="progress" hidden></div><div id="content" class="content"></div></main>
<aside class="conversation"><div class="side-heading"><button data-side="chat" class="selected">논문과 대화</button><button data-side="notes">내 노트</button><span class="provider">CODEX</span></div><div id="chat-pane"><div class="context-bar"><span class="dot"></span><span id="chat-context">논문을 선택하세요</span></div><div id="messages"></div><div id="suggestions"></div><form id="chat-form"><div id="quote-chip" hidden></div><textarea id="question" placeholder="이 논문의 가정이나 구현에 대해 질문…" rows="3" aria-label="질문"></textarea><div class="composer-bottom"><small id="chat-status">현재 브리프·선택 문맥</small><button id="send" class="primary" type="submit">보내기 ↑</button></div></form></div><div id="notes-pane" hidden><p>분석 결과와 별도로 저장되는 개인 노트입니다.</p><textarea id="notes" placeholder="해석, 아이디어, 다음 실험…" aria-label="개인 노트"></textarea><small id="note-status">자동 저장</small></div></aside>
<div id="selection" hidden><button id="ask-selection">선택한 내용 질문</button></div>
<dialog id="import-dialog"><form id="import-form"><div class="dialog-title"><h2>논문 추가</h2><button type="button" data-close="import-dialog">×</button></div><label id="pdf-drop" class="pdf-drop">PDF 파일 선택 또는 여기에 놓기<input id="paper-file" type="file" accept="application/pdf,.pdf"><span id="pdf-file-status" class="caption">최대 24MB · 원본 파일을 라이브러리에 보관합니다.</span></label><label>논문 제목 <span class="caption">선택 · PDF 제목이 없거나 잘못된 경우</span><input id="pdf-title" maxlength="500" placeholder="PDF 메타데이터에서 자동 추출"></label><p class="caption">또는 링크·제목으로 찾기</p><label>arXiv 링크 또는 논문 제목<input id="paper-input" placeholder="https://arxiv.org/abs/… 또는 제목"></label><label class="import-analysis"><input id="import-analyze" type="checkbox" checked> 추가 후 원문·코드 분석 시작</label><p class="caption">분석·번역은 본문을 Codex에 전달하며 사용량을 소비합니다. 스캔 PDF는 OCR 처리 후 분석할 수 있습니다.</p><div class="dialog-actions"><span id="import-status" role="status"></span><button type="submit" class="primary" id="import-submit">추가</button></div><div id="search-results"></div></form></dialog>
<dialog id="settings-dialog"><div class="dialog-title"><h2>연결 및 분석 지침</h2><button data-close="settings-dialog">×</button></div><div id="settings-body"></div></dialog><div id="toast" role="status" hidden></div>
</body></html>
