<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paperloom · Research</title><link rel="stylesheet" href="/research.css"><link rel="stylesheet" href="/knowledge.css"><link rel="stylesheet" href="/inbox.css"><link rel="stylesheet" href="/reader.css"><link rel="stylesheet" href="/discovery.css"><link rel="stylesheet" href="/katex.min.css"><link rel="stylesheet" href="/pdf-viewer.css"><script defer src="/reader-vendor.js"></script><script defer src="/math.js"></script><script defer src="/research.js"></script><script defer src="/inbox.js"></script><script defer src="/reader.js"></script><script defer src="/discovery.js"></script><script defer src="/workflow.js"></script><script defer src="/knowledge.js"></script></head><body>
<aside class="library"><div class="brand"><span class="logo">p</span><span>paperloom<small>RESEARCH WORKSPACE</small></span><button id="theme" title="테마: 시스템 / 밝게 / 어둡게" aria-label="테마 변경">◐</button></div><button id="home" class="home-button">⌂ Codex 수집함</button><button id="catalog" class="home-button">라이브러리 서가</button><button id="notebooks" class="home-button">개념 노트북</button><button id="discover" class="home-button">논문 연결 탐색</button><button id="add" class="primary add">＋ 논문 추가</button><label class="search"><span>⌕</span><input id="search" placeholder="라이브러리 검색" aria-label="라이브러리 검색"><kbd>⌘K</kbd></label><div class="library-tabs"><button data-filter="papers" class="selected">논문 <b id="paper-count">0</b></button><button data-filter="candidate">후보 <b id="candidate-count">0</b></button></div><div class="list-heading"><span id="list-label">MY PAPERS</span><span id="brief-count"></span></div><div id="paper-list" class="paper-list"></div><footer><button id="connections">연결 및 분석 지침 <span>↗</span></button><small id="sync-label">Notion MCP 메타데이터</small></footer></aside>
<main><header class="topbar"><div><span class="breadcrumb">Workspace</span><span>/</span><b id="crumb">Research</b></div><div><button id="export" title="Markdown 저장">내보내기 ↓</button><button id="toggle-side" title="대화창 표시 / 숨김">대화 ◫</button></div></header><div id="paper-header"></div><nav id="tabs"><button data-tab="brief" class="selected">브리프</button><button data-tab="html">HTML 원문</button><button data-tab="pdf">PDF</button><button data-tab="annotations">하이라이트</button><button data-tab="discovery">연결 논문</button><button data-tab="graph">원문 인용</button><button data-tab="concepts">공통 개념</button><button data-tab="labs">저자·연구실</button><button data-tab="code">코드 분석</button></nav><div id="progress" hidden></div><div id="content" class="content"></div></main>
<aside class="conversation"><div class="side-heading"><button data-side="chat" class="selected">논문과 대화</button><button data-side="notes">내 노트</button><span class="provider">CODEX</span></div><div id="chat-pane"><div class="context-bar"><span class="dot"></span><span id="chat-context">논문을 선택하세요</span></div><div id="messages"></div><div id="suggestions"></div><form id="chat-form"><div id="quote-chip" hidden></div><textarea id="question" placeholder="이 논문의 가정이나 구현에 대해 질문…" rows="3" aria-label="질문"></textarea><div class="composer-bottom"><small id="chat-status">현재 브리프·선택 문맥</small><button id="send" class="primary" type="submit">보내기 ↑</button></div></form></div><div id="notes-pane" hidden><p>분석 결과와 별도로 저장되는 개인 노트입니다.</p><textarea id="notes" placeholder="해석, 아이디어, 다음 실험…" aria-label="개인 노트"></textarea><small id="note-status">자동 저장</small></div></aside>
<div id="selection" hidden><button id="ask-selection">선택한 내용 질문</button></div>
<dialog id="import-dialog"><form id="import-form"><div class="dialog-title"><h2>논문에서 연구를 시작하세요</h2><button type="button" data-close="import-dialog">×</button></div><p>arXiv 링크를 넣으면 원문, 코드, 연구실, 관련 연구를 조사합니다.</p><label>arXiv 링크 또는 논문 제목<input id="paper-input" placeholder="https://arxiv.org/abs/2606.26095" required></label><div class="dialog-actions"><span>분석은 Codex 사용량을 소비합니다.</span><button type="submit" class="primary" id="import-submit">추가 및 분석</button></div><div id="search-results"></div></form></dialog>
<dialog id="settings-dialog"><div class="dialog-title"><h2>연결 및 분석 지침</h2><button data-close="settings-dialog">×</button></div><div id="settings-body"></div></dialog><div id="toast" role="status" hidden></div>
</body></html>
