name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/develop'
    runs-on: macos-15
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
      - id: version
        run: python scripts/release_version.py
      - run: python -m pip install -r requirements-build.txt
      - run: npm ci
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python scripts/check_public.py
      - run: python scripts/build_backend.py
      - name: Build macOS arm64
        env:
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          test "$(uname -m)" = arm64
          if [ "$PRERELEASE" = true ]; then
            npx electron-builder --dir --mac --arm64 --config.appId=local.paperloom.desktop.dev --config.productName="Paperloom Dev"
          else
            npx electron-builder --dir --mac --arm64
          fi
      - run: node tests/public-desktop.cjs
      - name: Package public application
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          mkdir -p release-assets
          APP=$(find dist/mac-arm64 -maxdepth 1 -name '*.app' -print -quit)
          ditto -c -k --sequesterRsrc --keepParent "$APP" "release-assets/Paperloom-${RELEASE_TAG}-macOS-arm64.zip"
          cd release-assets
          shasum -a 256 *.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-assets
          path: release-assets/*
          retention-days: 14
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-assets
          path: release-assets
      - name: Publish tested artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
          COMMIT: ${{ github.sha }}
        run: python scripts/publish_release.py
