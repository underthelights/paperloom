name: Release
on:
  push:
    tags: ['v*']
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/develop'
    runs-on: macos-15
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - id: version
        run: python scripts/release_version.py
      - run: python -m pip install -r requirements-build.txt
      - run: npm ci
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python scripts/check_public.py
      - run: python scripts/build_backend.py
      - name: Build macOS arm64
        env:
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          test "$(uname -m)" = arm64
          if [ "$PRERELEASE" = true ]; then
            npx electron-builder --dir --mac --arm64 --config.appId=local.paperloom.desktop.dev --config.productName="Paperloom Dev"
          else
            npx electron-builder --dir --mac --arm64
          fi
      - run: node tests/public-desktop.cjs
      - name: Package public application
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          mkdir -p release-assets
          APP=$(find dist/mac-arm64 -maxdepth 1 -name '*.app' -print -quit)
          ditto -c -k --sequesterRsrc --keepParent "$APP" "release-assets/Paperloom-${RELEASE_TAG}-macOS-arm64.zip"
          cd release-assets
          shasum -a 256 *.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-assets
          path: release-assets/*
          retention-days: 14
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-assets
          path: release-assets
      - name: Publish tested artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
          COMMIT: ${{ github.sha }}
        run: |
          if [ "$PRERELEASE" = true ]; then
            gh release create "$TAG" release-assets/* --target "$COMMIT" --title "Paperloom $TAG" --generate-notes --prerelease --latest=false
          else
            gh release create "$TAG" release-assets/* --verify-tag --title "Paperloom $TAG" --generate-notes --latest
          fi
